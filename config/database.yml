default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: postgres
  password: password

development:
  <<: *default
  database: benradler-development

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "benradler-test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
